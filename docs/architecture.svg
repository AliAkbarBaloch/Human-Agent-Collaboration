<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1060" font-family="Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="1400" height="1060" fill="#ffffff"/>
<defs>
  <marker id="arrowPurple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
  <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
  <marker id="arrowBlue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker>
  <marker id="arrowGreen" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker>
  <marker id="arrowRed" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker>
  <marker id="arrowOrange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker>
</defs>
<text x="700.0" y="40" font-size="22" font-weight="700" fill="#0f172a" text-anchor="middle">HALO — Adaptive Oversight Architecture</text>
<text x="700.0" y="63" font-size="12" font-weight="400" fill="#64748b" text-anchor="middle">The Injection Gateway is a mandatory checkpoint: every crossing between user, agent and outside world passes through it, in both directions</text>
<rect x="560" y="88" width="280" height="70" rx="14" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
<text x="700.0" y="114" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">User</text>
<text x="700.0" y="133" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle" font-style="italic">plans, approves, rejects, follows up</text>
<line x1="650" y1="158" x2="650" y2="236" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="640" y="202" font-size="11.5" font-weight="700" fill="#334155" text-anchor="end" stroke="#ffffff" stroke-width="5" paint-order="stroke">① task text</text>
<line x1="750" y1="236" x2="750" y2="158" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="760" y="202" font-size="11.5" font-weight="700" fill="#334155" text-anchor="start" stroke="#ffffff" stroke-width="5" paint-order="stroke">⑧ verified answer / block</text>
<rect x="240" y="236" width="1000" height="124" rx="14" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
<text x="740.0" y="262" font-size="16" font-weight="700" fill="#7f1d1d" text-anchor="middle">Injection Gateway — AI Firewall  (Gap 2)</text>
<text x="740.0" y="281" font-size="10.5" font-weight="400" fill="#9f1239" text-anchor="middle" font-style="italic">injection_gateway.py  ·  scan_and_gate() + action-hijack screening  ·  inspects every crossing shown here</text>
<text x="740.0" y="306" font-size="10.5" font-weight="400" fill="#334155" text-anchor="middle">pattern scanner (25 signatures) fused with a semantic LLM layer  ·  on detection the run pauses: Block Page / Continue Anyway</text>
<text x="740.0" y="323" font-size="10.5" font-weight="400" fill="#334155" text-anchor="middle">scans task text, web pages, files, code output and MCP tool results  ·  the LLM never sees injected content unless the user allows it</text>
<line x1="400" y1="360" x2="400" y2="470" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arrowBlue)"/>
<text x="390" y="420" font-size="11.5" font-weight="700" fill="#1d4ed8" text-anchor="end" stroke="#ffffff" stroke-width="5" paint-order="stroke">②⑥ clean task / verified content</text>
<line x1="520" y1="470" x2="520" y2="360" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arrowBlue)"/>
<text x="530" y="420" font-size="11.5" font-weight="700" fill="#1d4ed8" text-anchor="start" stroke="#ffffff" stroke-width="5" paint-order="stroke">③⑦ proposed action / draft answer</text>
<line x1="960" y1="360" x2="960" y2="470" stroke="#0f766e" stroke-width="2" marker-end="url(#arrowGreen)"/>
<text x="950" y="420" font-size="11.5" font-weight="700" fill="#0f766e" text-anchor="end" stroke="#ffffff" stroke-width="5" paint-order="stroke">④ scanned action</text>
<line x1="1080" y1="470" x2="1080" y2="360" stroke="#0f766e" stroke-width="2" marker-end="url(#arrowGreen)"/>
<text x="1090" y="420" font-size="11.5" font-weight="700" fill="#0f766e" text-anchor="start" stroke="#ffffff" stroke-width="5" paint-order="stroke">⑤ page / file / tool result</text>
<rect x="260" y="470" width="420" height="112" rx="14" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/>
<text x="470.0" y="496" font-size="14" font-weight="700" fill="#312e81" text-anchor="middle">Agent / Orchestrator</text>
<text x="470.0" y="515" font-size="10.5" font-weight="400" fill="#3730a3" text-anchor="middle" font-style="italic">trusted core (Magentic-UI)</text>
<text x="470.0" y="540" font-size="10.5" font-weight="400" fill="#334155" text-anchor="middle">web surfer  ·  coder  ·  file surfer  ·  MCP agent</text>
<text x="470.0" y="557" font-size="10.5" font-weight="400" fill="#334155" text-anchor="middle">never talks to the user or the world directly</text>
<rect x="800" y="470" width="420" height="112" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
<text x="1010.0" y="496" font-size="14" font-weight="700" fill="#134e4a" text-anchor="middle">External World</text>
<text x="1010.0" y="515" font-size="10.5" font-weight="400" fill="#115e59" text-anchor="middle" font-style="italic">untrusted content</text>
<text x="1010.0" y="540" font-size="10.5" font-weight="400" fill="#334155" text-anchor="middle">Web  ·  Sandbox  ·  MCP tools</text>
<text x="1010.0" y="557" font-size="10.5" font-weight="400" fill="#334155" text-anchor="middle">everything returned is scanned again</text>
<path d="M240,300 L150,300 L150,760 L236,760" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrowPurple)" stroke-dasharray="7 5"/>
<text x="142" y="540" font-size="11.5" font-weight="700" fill="#7c3aed" text-anchor="end" stroke="#ffffff" stroke-width="5" paint-order="stroke">Ⓐ risk score</text>
<line x1="400" y1="680" x2="400" y2="584" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrowPurple)"/>
<text x="390" y="640" font-size="11.5" font-weight="700" fill="#7c3aed" text-anchor="end" stroke="#ffffff" stroke-width="5" paint-order="stroke">Ⓑ approval policy</text>
<line x1="520" y1="584" x2="520" y2="680" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrowPurple)" stroke-dasharray="7 5"/>
<text x="530" y="640" font-size="11.5" font-weight="700" fill="#7c3aed" text-anchor="start" stroke="#ffffff" stroke-width="5" paint-order="stroke">Ⓒ approve / reject feedback</text>
<rect x="240" y="680" width="1000" height="250" rx="16" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
<text x="740" y="710" font-size="16" font-weight="700" fill="#4c1d95" text-anchor="middle">Risk + Trust Engine</text>
<text x="740" y="730" font-size="11" font-weight="400" fill="#5b21b6" text-anchor="middle" font-style="italic">decides how strict approval is: auto-permissive  ·  auto-conservative  ·  always</text>
<rect x="264" y="748" width="466" height="160" rx="14" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
<text x="280" y="774" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="start">Risk — Gap 1 Adaptive Action Guard</text>
<text x="280" y="793" font-size="10.5" font-weight="400" fill="#334155" text-anchor="start" font-style="italic">task_classifier.py  ·  llm_risk_estimator.py</text>
<text x="280" y="818" font-size="10.5" font-weight="400" fill="#334155" text-anchor="start">• every task classified fresh, from its own words</text>
<text x="280" y="835" font-size="10.5" font-weight="400" fill="#334155" text-anchor="start">• research → auto-permissive</text>
<text x="280" y="852" font-size="10.5" font-weight="400" fill="#334155" text-anchor="start">• transactional → auto-conservative</text>
<text x="280" y="869" font-size="10.5" font-weight="400" fill="#334155" text-anchor="start">• destructive → always (hard floor)</text>
<rect x="750" y="748" width="466" height="160" rx="14" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
<text x="766" y="774" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="start">Trust — Gap 3 Bayesian Trust Calibration</text>
<text x="766" y="793" font-size="10.5" font-weight="400" fill="#334155" text-anchor="start" font-style="italic">feedback_loop.py  ·  TrustProfile DB row</text>
<text x="766" y="818" font-size="10.5" font-weight="400" fill="#334155" text-anchor="start">• per-user, per-task-type Beta-distribution score</text>
<text x="766" y="835" font-size="10.5" font-weight="400" fill="#334155" text-anchor="start">• rejections cost more than approvals earn</text>
<text x="766" y="852" font-size="10.5" font-weight="400" fill="#334155" text-anchor="start">• persists across sessions; closed loop by default</text>
<text x="766" y="869" font-size="10.5" font-weight="400" fill="#334155" text-anchor="start">• can never loosen a destructive task</text>
<rect x="360" y="972" width="12" height="12" fill="#334155"/>
<text x="378" y="982" font-size="11" font-weight="400" fill="#475569" text-anchor="start">user ↔ gateway</text>
<rect x="540" y="972" width="12" height="12" fill="#1d4ed8"/>
<text x="558" y="982" font-size="11" font-weight="400" fill="#475569" text-anchor="start">agent ↔ gateway</text>
<rect x="720" y="972" width="12" height="12" fill="#0f766e"/>
<text x="738" y="982" font-size="11" font-weight="400" fill="#475569" text-anchor="start">world ↔ gateway</text>
<rect x="900" y="972" width="12" height="12" fill="#7c3aed"/>
<text x="918" y="982" font-size="11" font-weight="400" fill="#475569" text-anchor="start">oversight loop (Ⓐ–Ⓒ)</text>
<text x="700" y="1012" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle" font-style="italic">Numbered steps ①–⑧ are one round trip; Ⓐ–Ⓒ run alongside it.</text>
</svg>
